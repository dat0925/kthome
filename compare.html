const b=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function open(pin){
 const km=await crypto.subtle.importKey("raw",new TextEncoder().encode(pin),"PBKDF2",false,["deriveKey"]);
 const k=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b(D.salt),iterations:D.it,hash:"SHA-256"},km,{name:"AES-GCM",length:256},false,["decrypt"]);
 const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:b(D.iv)},k,b(D.ct));
 return JSON.parse(new TextDecoder().decode(pt));
}
document.getElementById("gate").addEventListener("submit",async e=>{
 e.preventDefault();
 const err=document.getElementById("err"),btn=e.target.querySelector("button");
 err.textContent="";btn.disabled=true;btn.textContent="確認中...";
 try{
  const r=await open(document.getElementById("pin").value);
  const st=document.createElement("style");st.textContent=r.css;document.head.appendChild(st);
  document.body.style.cssText="display:block;min-height:0";
  document.getElementById("gate").remove();
  const app=document.getElementById("app");app.innerHTML=r.html;app.hidden=false;
  window.scrollTo(0,0);
 }catch(x){err.textContent="PINが違います";btn.disabled=false;btn.textContent="開く"}
});
